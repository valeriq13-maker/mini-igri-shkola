<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Миниигри и упражнения | Школа</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 18px;
      background: radial-gradient(ellipse at top,
        #34205e, #13132f 65%, #090d20);
      color: #f6edda;
      font-family: Georgia, serif;
      text-align: center;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
    }
    h1 {
      color: #f4d486;
      font-size: clamp(25px, 6vw, 37px);
      line-height: 1.3;
    }
    .subtitle {
      color: #d4c4ed;
      line-height: 1.7;
    }
    .line {
      width: 130px;
      height: 1px;
      margin: 28px auto;
      background: #d6af61;
    }
    .game {
      display: block;
      margin: 14px 0;
      padding: 20px;
      border: 1px solid #cba85c;
      border-radius: 16px;
      background: #ffffff0c;
      color: #f4d486;
      text-decoration: none;
    }
    .game strong {
      display: block;
      font-size: 20px;
    }
    .game span {
      display: block;
      margin-top: 8px;
      color: #eee5f6;
      font-size: 14px;
    }
    .empty {
      padding: 30px 10px;
      color: #e1d2f0;
    }
  </style>
</head>
<body>
  <main>
    <h1>✨ Миниигри и упражнения ✨</h1>
    <p class="subtitle">
      Школа за енергийни практики
      и духовно развитие
    </p>
    <div class="line"></div>
    <p class="subtitle">
      Открийте света на интуицията,
      паметта и духовните символи.
    </p>
    <section id="games">
      <p class="empty">🎮 Очаквайте скоро!</p>
    </section>
  </main>

  <script>
    fetch('./games.json', {cache: 'no-store'})
      .then(response => {
        if (!response.ok) throw new Error('No games');
        return response.json();
      })
      .then(games => {
        if (!Array.isArray(games) || !games.length) return;
        const section = document.getElementById('games');
        section.replaceChildren();

        games.forEach(game => {
          if (!game.title || !game.url) return;
          const link = document.createElement('a');
          link.className = 'game';
          link.href = game.url;

          const title = document.createElement('strong');
          title.textContent = game.title;
          const description = document.createElement('span');
          description.textContent = game.description || '';

          link.append(title, description);
          section.appendChild(link);
        });
      })
      .catch(() => {});
  </script>
</body>
</html>
